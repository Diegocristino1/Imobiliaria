{% extends "admin/base.html" %}
{% block title %}Novo imóvel{% endblock %}
{% block content %}
<header class="admin-page-head">
  <p class="admin-back"><a href="{{ url_for('admin.painel') }}">← Voltar ao painel</a></p>
  <h1>Cadastrar novo imóvel</h1>
  <p>Preencha os dados e envie as fotos. Depois você poderá adicionar mais imagens na página do imóvel.</p>
</header>

<form class="admin-form admin-form--wide" method="post" enctype="multipart/form-data" action="{{ url_for('admin.novo_imovel') }}">
  <div class="admin-form-grid">
    <label class="admin-field admin-field--full">
      <span>Título *</span>
      <input type="text" name="titulo" required maxlength="200" placeholder="Ex.: Casa — Buritis IV (escriturada)" value="{{ form.titulo if form else '' }}">
    </label>

    <label class="admin-field admin-field--full">
      <span>Descrição *</span>
      <textarea name="descricao" rows="8" required placeholder="Texto completo do anúncio…">{{ form.descricao if form else '' }}</textarea>
    </label>

    <label class="admin-field">
      <span>Preço (R$)</span>
      <input type="text" name="preco" inputmode="decimal" placeholder="410000 ou 410.000,00" value="{{ form.preco if form else '' }}">
      <small class="admin-hint">Deixe em branco ou 0 para «Sob consulta».</small>
    </label>

    <label class="admin-field">
      <span>Tipo *</span>
      <select name="tipo" required>
        {% for t in tipos %}
        <option value="{{ t }}" {% if form and form.tipo == t %}selected{% elif not form and t == 'casa' %}selected{% endif %}>{{ t|tipo_label }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="admin-field">
      <span>Área (m²)</span>
      <input type="number" name="area_m2" min="0" step="0.01" value="{{ form.area_m2 if form else '' }}">
    </label>

    <label class="admin-field">
      <span>Quartos</span>
      <input type="number" name="quartos" min="0" value="{{ form.quartos if form else '0' }}">
    </label>

    <label class="admin-field">
      <span>Banheiros</span>
      <input type="number" name="banheiros" min="0" value="{{ form.banheiros if form else '0' }}">
    </label>

    <label class="admin-field">
      <span>Vagas</span>
      <input type="number" name="vagas" min="0" value="{{ form.vagas if form else '0' }}">
    </label>

    <label class="admin-field">
      <span>Bairro *</span>
      <input type="text" name="bairro" required maxlength="120" placeholder="Buritis IV" value="{{ form.bairro if form else '' }}">
    </label>

    <label class="admin-field">
      <span>Cidade</span>
      <input type="text" name="cidade" maxlength="120" value="{{ form.cidade if form else 'Planaltina' }}">
    </label>

    <label class="admin-field">
      <span>Estado</span>
      <input type="text" name="estado" maxlength="2" value="{{ form.estado if form else 'DF' }}">
    </label>

    <label class="admin-field admin-field--full">
      <span>Endereço / localização *</span>
      <input type="text" name="endereco" required maxlength="255" placeholder="Quadra 22, Buritis IV, Planaltina/DF" value="{{ form.endereco if form else '' }}">
    </label>

    <label class="admin-field admin-field--check admin-field--full">
      <input type="checkbox" name="destaque" value="1" {% if not form or form.get('destaque') %}checked{% endif %}>
      <span>Exibir em destaque na página inicial</span>
    </label>

    <label class="admin-field admin-field--full admin-field--upload">
      <span>Fotos do imóvel *</span>
      <input type="file" name="fotos" accept="image/jpeg,image/png,image/webp,image/gif" multiple required>
      <small class="admin-hint">Selecione uma ou várias fotos (JPG, PNG ou WebP — até 12 MB cada).</small>
    </label>
  </div>

  <div class="admin-form-actions">
    <button type="submit" class="btn btn--primary btn--lg">Cadastrar imóvel</button>
    <a class="btn btn--ghost" href="{{ url_for('admin.painel') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
